name: coralstack

# Comment out any service you don't want to run. Caddy is required; it's the
# TLS boundary and subdomain router for everything else.
include:
  - services/pocket-id/docker-compose.yml
  - services/vaultwarden/docker-compose.yml
  - services/ente/docker-compose.yml
  - services/jellyfin/docker-compose.yml
  - services/music/docker-compose.yml
  - services/dispatcharr/docker-compose.yml
  - services/arr/docker-compose.yml
  - services/portainer/docker-compose.yml
  - services/homepage/docker-compose.yml
  - services/open-webui/docker-compose.yml
  - services/matrix/docker-compose.yml
  - services/uptime-kuma/docker-compose.yml
  - services/smart/docker-compose.yml
  - services/autokuma/docker-compose.yml
  - services/drift/docker-compose.yml
  - services/backup/docker-compose.yml
  - services/ente-janitor/docker-compose.yml
  - services/admin-panel/docker-compose.yml

# The project's default network is named `coralstack`. Every service in this
# compose (and every included compose) lands on it automatically, so Caddy
# can reach upstream services by container name without per-service network
# declarations. Lets us include third-party compose files verbatim.
networks:
  default:
    name: coralstack

services:
  caddy:
    build: ./caddy
    image: coralstack/caddy:cloudflare
    # Custom-built image, and NO VERSION IN THIS TAG on purpose. It is a local
    # build name, not a registry reference: `build: ./caddy` means compose
    # builds it when it is missing and never fetches it, so no pull_policy is
    # needed. Renovate maintains the real version in caddy/Dockerfile's FROM
    # lines, which it understands; it cannot see this string, so a version here
    # is a label nothing updates. It had drifted to claiming 2.11.2 while the
    # binary inside was 2.11.7 (verified with `docker exec caddy caddy
    # version`). The version lives in the Dockerfile.
    #
    # DO NOT add `pull_policy: build` back. It means "rebuild even when the
    # image is already present", and a rebuild is only harmless when the
    # resulting image id is stable — which it is NOT by default: Docker's
    # default provenance attestation makes a fully CACHED rebuild produce a new
    # id, and compose recreates any container whose id moved. That replaced
    # Caddy on every deploy, handing it a new bridge IP and leaving a
    # long-running Uptime Kuma probing the old address (see MONITORING.md).
    #
    # setup.sh exports BUILDX_NO_DEFAULT_ATTESTATIONS=1 and passes --build, so
    # the deploy path rebuilds a changed context WITHOUT recreating an unchanged
    # one. Leaving pull_policy off keeps a hand-run `docker compose up -d`,
    # which does not have that variable set, from reintroducing the churn: it
    # reuses the local image instead. Worst case is a stale image, which the
    # next ./setup.sh corrects — a better failure than a false page.
    container_name: caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CF_API_TOKEN: ${CF_API_TOKEN}
      # The SNI router allowed to send PROXY protocol headers (see the
      # Caddyfile's global options). The default trusts loopback only, which
      # nothing connects from: unset means off. An empty list also trusts
      # nobody on Caddy 2.11.7 (tested 2026-10-26); the explicit default keeps
      # it that way without depending on how a later Caddy reads an empty one.
      PROXY_PROTOCOL_FROM: ${PROXY_PROTOCOL_FROM:-127.0.0.1/32}
    volumes:
      # The directory, not the single file. git pull replaces the Caddyfile
      # with a new file, and a single-file bind mount keeps showing the old
      # one until the container is recreated, so an edit never reached the
      # running Caddy. Through a directory mount the new file is visible at
      # once, and setup.sh applies it with a graceful `caddy reload`. The
      # directory's Dockerfile shows up in /etc/caddy too; Caddy ignores it.
      - ./caddy:/etc/caddy:ro
      - ${DATA_PATH:?DATA_PATH must be set in .env — run ./setup.sh which resolves it to an absolute path}/caddy/data:/data
      - ${DATA_PATH:?DATA_PATH must be set in .env — run ./setup.sh which resolves it to an absolute path}/caddy/config:/config
    # Register every coralstack subdomain as a docker network alias on Caddy
    # so that inter-service calls using the public FQDN (e.g. Jellyfin's SSO
    # plugin calling id.${BASE_DOMAIN}/.well-known/openid-configuration)
    # resolve internally to Caddy via Docker's embedded DNS instead of going
    # out through eero's hairpin NAT. Caddy still routes by SNI to the right
    # upstream; LE certs still valid because hostnames match.
    #
    # When adding a new subdomain to the Caddyfile, also add it here.
    networks:
      default:
        aliases:
          - ${BASE_DOMAIN}
          - id.${BASE_DOMAIN}
          - vault.${BASE_DOMAIN}
          - media.${BASE_DOMAIN}
          - photos.${BASE_DOMAIN}
          - photos-api.${BASE_DOMAIN}
          - photos-accounts.${BASE_DOMAIN}
          - photos-albums.${BASE_DOMAIN}
          - photos-storage.${BASE_DOMAIN}
          - ai.${BASE_DOMAIN}
          - status.${BASE_DOMAIN}
          # Matrix. These three are load-bearing: Caddy carries every vhost as a
          # docker network alias so inter-service calls resolve on the bridge
          # instead of hairpinning out through the eero. MATRIX.md's pre-flight
          # names this and the branch had not done it — added 2026-10-15 after
          # diffing the Caddyfile's vhosts against this list.
          - chat.${BASE_DOMAIN}
          - auth.${BASE_DOMAIN}
          - matrix.${BASE_DOMAIN}
