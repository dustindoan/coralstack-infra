name: coralstack

# Comment out any service you don't want to run. Caddy is required; it's the
# TLS boundary and subdomain router for everything else.
include:
  - services/pocket-id/docker-compose.yml
  - services/vaultwarden/docker-compose.yml
  - services/ente/docker-compose.yml
  - services/jellyfin/docker-compose.yml
  - services/music/docker-compose.yml
  - services/dispatcharr/docker-compose.yml
  - services/arr/docker-compose.yml
  - services/portainer/docker-compose.yml
  - services/homepage/docker-compose.yml
  - services/open-webui/docker-compose.yml
  - services/matrix/docker-compose.yml
  - services/uptime-kuma/docker-compose.yml
  - services/smart/docker-compose.yml
  - services/autokuma/docker-compose.yml
  - services/drift/docker-compose.yml
  - services/backup/docker-compose.yml
  - services/ente-janitor/docker-compose.yml
  - services/admin-panel/docker-compose.yml

# The project's default network is named `coralstack`. Every service in this
# compose (and every included compose) lands on it automatically, so Caddy
# can reach upstream services by container name without per-service network
# declarations. Lets us include third-party compose files verbatim.
networks:
  default:
    name: coralstack

services:
  caddy:
    build: ./caddy
    image: coralstack/caddy:cloudflare
    # Custom-built image — don't try to pull it from a registry.
    #
    # NO VERSION IN THIS TAG, on purpose. It is a local build name, not a
    # registry reference: `build: ./caddy` plus `pull_policy: build` means
    # nothing ever fetches it. Renovate maintains the real version in
    # caddy/Dockerfile's FROM lines, which it understands — but it cannot see
    # this string, so a version here is a label nothing updates. It had drifted
    # to claiming 2.11.2 while the binary inside was 2.11.7 (verified with
    # `docker exec caddy caddy version`). The version lives in the Dockerfile.
    pull_policy: build
    container_name: caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_PATH:?DATA_PATH must be set in .env — run ./setup.sh which resolves it to an absolute path}/caddy/data:/data
      - ${DATA_PATH:?DATA_PATH must be set in .env — run ./setup.sh which resolves it to an absolute path}/caddy/config:/config
    # Register every coralstack subdomain as a docker network alias on Caddy
    # so that inter-service calls using the public FQDN (e.g. Jellyfin's SSO
    # plugin calling id.${BASE_DOMAIN}/.well-known/openid-configuration)
    # resolve internally to Caddy via Docker's embedded DNS instead of going
    # out through eero's hairpin NAT. Caddy still routes by SNI to the right
    # upstream; LE certs still valid because hostnames match.
    #
    # When adding a new subdomain to the Caddyfile, also add it here.
    networks:
      default:
        aliases:
          - ${BASE_DOMAIN}
          - id.${BASE_DOMAIN}
          - vault.${BASE_DOMAIN}
          - media.${BASE_DOMAIN}
          - photos.${BASE_DOMAIN}
          - photos-api.${BASE_DOMAIN}
          - photos-accounts.${BASE_DOMAIN}
          - photos-albums.${BASE_DOMAIN}
          - photos-storage.${BASE_DOMAIN}
          - ai.${BASE_DOMAIN}
          - status.${BASE_DOMAIN}
          # Matrix. These three are load-bearing: Caddy carries every vhost as a
          # docker network alias so inter-service calls resolve on the bridge
          # instead of hairpinning out through the eero. MATRIX.md's pre-flight
          # names this and the branch had not done it — added 2026-10-15 after
          # diffing the Caddyfile's vhosts against this list.
          - chat.${BASE_DOMAIN}
          - auth.${BASE_DOMAIN}
          - matrix.${BASE_DOMAIN}
