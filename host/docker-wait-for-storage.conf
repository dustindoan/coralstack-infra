# Drop-in for docker.service. Install to:
#   /etc/systemd/system/docker.service.d/wait-for-storage.conf
#
# Why: containers using ${STORAGE_PATH} bind-mount whatever exists at that path
# at the instant they start, and a bind never re-resolves. If dockerd starts
# before /mnt/storage is mounted, every storage-backed container silently binds
# an empty directory on the root filesystem and stays that way until restarted.
# On 2026-08-28 the USB array enumerated 9s after dockerd; Jellyfin came up
# reporting healthy while serving an empty library.
#
# Wants= (not Requires=) is deliberate: Docker waits for the mount ATTEMPT to
# settle, then starts either way. A permanently dead disk must not take Caddy,
# the admin panel, or SSH-adjacent services down with it -- that is the state in
# which you most need remote access. Detection of a dead disk is the job of the
# storage healthchecks, not of refusing to boot.
[Unit]
After=mnt-storage.mount
Wants=mnt-storage.mount
