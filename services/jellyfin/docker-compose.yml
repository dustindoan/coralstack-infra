services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    # Docker's default nofile soft limit is 1024. A library scan over a few hundred
    # episodes fans out concurrent TheMovieDb + OMDb metadata fetches and blows
    # through that — EAGAIN on every new socket, Jellyfin's HTTP listener wedges,
    # Caddy returns ERR_EMPTY_RESPONSE to the browser. Container reports healthy
    # because the healthcheck holds an existing FD. Raise it.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # GPU hardware transcoding (Intel Quick Sync): this committed compose stays
    # portable (no GPU assumptions). On a host that has the iGPU passed through to
    # the VM, the /dev/dri device + render GID are added via a gitignored
    # docker-compose.override.yml at the repo root (auto-merged). Full procedure +
    # the override snippet: docs/GPU_TRANSCODING.md.
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://media.${BASE_DOMAIN}
    volumes:
      - ${DATA_PATH:?DATA_PATH must be set (run ./setup.sh which resolves it to an absolute path)}/jellyfin/config:/config
      - ${DATA_PATH}/jellyfin/cache:/cache
      # The music-ingest container (services/music) owns writes to the music
      # library via beets; Jellyfin reads it read-only
      - ${STORAGE_PATH}/music:/media/music:ro
      # shows/ and movies/ live under ${STORAGE_PATH}/media/ so the *arr stack
      # (services/arr) can mount that one directory and get working hardlinks
      # between the libraries and the download landing area. The CONTAINER
      # paths are unchanged, so Jellyfin's library configuration needs no edit;
      # only the host side moved. (movies/ joined when Radarr landed — the
      # "until something actually manages them" condition.)
      - ${STORAGE_PATH}/media/movies:/media/movies:ro
      - ${STORAGE_PATH}/media/shows:/media/shows:ro

    # The stock image healthcheck only probes the HTTP endpoint, so it reports
    # healthy even when the library is empty. A bind mount resolves ONCE, at
    # container start, and never re-resolves: if dockerd wins the race against
    # mnt-storage.mount, this container is pinned to an empty directory on the
    # root filesystem for its entire life. That happened on 2026-08-28 -- the
    # array enumerated 9s after dockerd, Jellyfin reported healthy, and served
    # nothing. Check the DATA as well as the port so the failure is loud.
    # Ordering fix this backstops: host/docker-wait-for-storage.conf
    healthcheck:
      test:
        - CMD-SHELL
        - curl --noproxy localhost -Lk -fsS http://localhost:8096/health >/dev/null && ls -A /media/music | grep -q .
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
