# SMART disk monitoring — advance warning that a drive is going.
# See docs/HARDWARE_FAILURE.md (what to do about a finding) and
# docs/MONITORING.md (how the alert reaches you).
#
# ─── SCOPE: this container sees only the disks THIS VM can see ───────────────
# The apps VM has the TerraMaster passed through over USB, so this catches the
# drive holding the photo blobs and media. It CANNOT see the NUC's M.2 SSD —
# from inside the VM that's a virtio device with no SMART behind it. The M.2 is
# monitored separately by the same script running natively on the Proxmox host
# (services/smart/host/). Both halves are needed; neither covers the other.
#
# ─── Why this container needs block-device access ────────────────────────────
# Reading SMART means issuing SG_IO ioctls to the raw device, so a normal
# unprivileged container cannot do it. We grant the narrowest thing that works
# rather than `privileged: true`:
#   - /dev bind mount        : so the device nodes exist in the container
#   - device_cgroup_rules    : Docker's device cgroup denies access even when
#                              the node is visible; this re-allows block devices
#   - cap_add: SYS_RAWIO     : required to issue the ioctl
# That is still meaningful access — this container can read any block device on
# the VM — which is why the image is a plain alpine with four packages and the
# only thing it runs is one auditable script. If your host still refuses (some
# kernel/storage-driver combinations do), the documented fallback is
# `privileged: true`; take it knowingly, not by default.
services:
  smart:
    build: .
    image: coralstack/smart:smartmontools
    # Custom-built image — don't try to pull it from a registry.
    pull_policy: build
    container_name: smart
    restart: unless-stopped
    env_file:
      # Hand-created on the box from .env.example (deploy workflow).
      - path: .env
        required: false
    environment:
      TZ: ${TZ}
      SMART_HOST_LABEL: ${SMART_HOST_LABEL:-apps-vm}
      SMART_REPORT_PATH: /var/lib/smart/report.txt
    volumes:
      - /dev:/dev
      # The latest report, persisted where you can still read it when the
      # container itself is the thing that won't start.
      - ${DATA_PATH:?DATA_PATH must be set in .env — run ./setup.sh}/smart:/var/lib/smart
    device_cgroup_rules:
      # b = block devices, rw = SG_IO passthrough counts as a write
      - 'b *:* rw'
    cap_add:
      - SYS_RAWIO
