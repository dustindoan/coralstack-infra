# ── Sonarr (TV series manager) ───────────────────────────────────────────────
# Watches a wanted-list of series, queries configured indexers, hands releases
# to a download client, then renames + imports into ${STORAGE_PATH}/media/shows
# — the same directory Jellyfin mounts read-only as its TV library.
#
# NO INDEXER OR DOWNLOAD CLIENT IS CONFIGURED HERE. Sonarr ships inert: it
# manages a library and does nothing until you point it at sources.
services:
  # ── VPN egress sidecar ──────────────────────────────────────────────────────
  # Same rationale and same gotchas as dispatcharr-vpn (read that compose file's
  # header for the full ExpressVPN custom-OpenVPN explanation — it applies here
  # verbatim). Sonarr's indexer queries and any download-client traffic egress
  # through this tunnel instead of the apps VM's residential WAN.
  #
  # Deliberately a SEPARATE Gluetun instance rather than sharing dispatcharr-vpn:
  # the two services stay independently restartable, and Sonarr's port doesn't
  # have to be published from Dispatcharr's compose file. Cost is a second tunnel
  # and a second .ovpn to maintain (ExpressVPN allows multiple simultaneous
  # connections, so one credential pair covers both).
  #
  # Setup — expressvpn.com → Advanced Setup → Manual Configuration → OpenVPN:
  #   - OpenVPN username + password (NOT your account login) → services/sonarr/.env
  #   - a server .ovpn → services/sonarr/expressvpn.ovpn (gitignored; may be a
  #     copy of the one under services/dispatcharr)
  # GOTCHA: Gluetun's custom parser rejects a hostname in the `remote` line
  # (gluetun#2769). After downloading, replace it with the resolved IP:
  #   host=$(awk '/^remote /{print $2; exit}' expressvpn.ovpn); ip=$(getent hosts "$host" | awk '{print $1; exit}')
  #   sed -i "s|^remote $host |remote $ip |" expressvpn.ovpn
  # Re-do this on every .ovpn swap. Do NOT set SERVER_COUNTRIES/CITIES.
  #
  # FAIL-CLOSED: Sonarr shares this container's netns and Gluetun default-drops
  # non-tunnel egress. If the tunnel drops, Sonarr's traffic is BLOCKED, not
  # rerouted to the residential WAN.
  sonarr-vpn:
    image: qmcgaw/gluetun:v3.41.1
    container_name: sonarr-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # OPENVPN_USER, OPENVPN_PASSWORD. Compose ${...} interpolation only reads the
    # root .env, so per-service secrets come via env_file (same as dispatcharr).
    env_file:
      - path: .env
        required: false
    volumes:
      - ./expressvpn.ovpn:/gluetun/custom.ovpn:ro
    # This container owns Sonarr's published port (see network_mode below).
    # Admin-plane: loopback only — no Caddy route/alias. Reach via:
    #   ssh -L 8989:localhost:8989 coralstack-apps
    ports:
      - "127.0.0.1:8989:8989"
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: openvpn
      OPENVPN_CUSTOM_CONFIG: /gluetun/custom.ovpn
      # Kill-switch allows replies to the coralstack Docker subnet so the
      # loopback admin tunnel reaches the web UI without being forced through
      # the tunnel. = `docker network inspect coralstack` subnet.
      #
      # NOTE (deferred): when the content-origination box lands on the LAN,
      # Sonarr won't be able to reach it — the kill-switch drops LAN-bound
      # egress. Add the LAN subnet here at that point.
      FIREWALL_OUTBOUND_SUBNETS: 172.18.0.0/16
      TZ: ${TZ}
    networks:
      - default

  # ── Sonarr ──────────────────────────────────────────────────────────────────
  sonarr:
    image: linuxserver/sonarr:4.0.19
    container_name: sonarr
    restart: unless-stopped
    # Share the VPN sidecar's netns: all egress goes through the tunnel, and the
    # web UI is published via the sidecar's ports above. A container using
    # network_mode: service:* CANNOT also join the coralstack network —
    # reachability comes from the sidecar, which is on it.
    network_mode: "service:sonarr-vpn"
    depends_on:
      sonarr-vpn:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # linuxserver images drop privileges to this uid/gid, which must own
      # ${STORAGE_PATH}/media or imports fail with permission errors. Defaults
      # suit a single-admin Ubuntu box (first user = 1000).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DATA_PATH:?DATA_PATH must be set (run ./setup.sh which resolves it to an absolute path)}/sonarr:/config
      # ONE mount for both the library and the download landing area, so
      # /data/shows and /data/downloads share a mount point inside the container
      # and hardlinks work. Two separate binds would return EXDEV on link() even
      # though both sit on the same filesystem, silently degrading Sonarr to
      # copying — slow, double space, and it breaks seeding. Keep this a single
      # mount when adding Radarr/Lidarr or a download client.
      #
      # Read-WRITE: Sonarr owns renames + imports. Jellyfin mounts the same
      # library subdirs read-only (services/jellyfin) and picks up new episodes
      # via its real-time monitor.
      - ${STORAGE_PATH:?STORAGE_PATH must be set in .env}/media:/data
